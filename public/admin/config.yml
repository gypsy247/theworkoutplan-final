backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

publish_mode: editorial_workflow

collections:
  - name: "site"
    label: "Site Content"
    icon: "settings"
    files:
      - name: "siteContent"
        label: "Site Content"
        file: "src/data/siteContent.json"
        description: "Every editable piece of text, pricing, and imagery on the website."
        fields:
          - label: "Promo Banner"
            name: "promoBanner"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Show Banner", name: "enabled", widget: "boolean", default: true }
              - { label: "Banner Text", name: "text", widget: "string" }
              - { label: "Promo Code", name: "code", widget: "string" }
          - label: "Homepage Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Badge Text", name: "badgeText", widget: "string" }
              - { label: "Headline — Start", name: "headlineStart", widget: "string" }
              - { label: "Headline — Highlighted Word(s)", name: "headlineHighlight", widget: "string" }
              - { label: "Headline — End", name: "headlineEnd", widget: "string" }
              - { label: "Subheadline", name: "subheadline", widget: "text" }
              - { label: "Primary Button Text", name: "primaryCta", widget: "string" }
              - { label: "Secondary Button Text", name: "secondaryCta", widget: "string" }
          - label: "Studio Info"
            name: "studioInfo"
            widget: "object"
            fields:
              - { label: "Studio Name", name: "name", widget: "string" }
              - { label: "Head Coach", name: "headCoach", widget: "string" }
              - { label: "Google Rating", name: "rating", widget: "string" }
              - { label: "Review Count", name: "reviewCount", widget: "string" }
              - { label: "Address", name: "address", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Acuity Booking Page URL", name: "acuityDirectUrl", widget: "string" }
              - { label: "Acuity Embed URL", name: "acuityEmbedUrl", widget: "string" }
              - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
              - { label: "Facebook URL", name: "facebookUrl", widget: "string" }
              - { label: "TikTok URL", name: "tiktokUrl", widget: "string" }
          - label: "The Plan — Pillars"
            name: "pillars"
            widget: "list"
            label_singular: "Pillar"
            fields:
              - { label: "Number", name: "number", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Feature Tags"
                name: "tags"
                widget: "list"
                required: false
                field: { label: "Tag", name: "tag", widget: "string" }
          - label: "Studio Gallery Photos"
            name: "studioPhotos"
            widget: "list"
            label_singular: "Photo"
            fields:
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string" }
          - label: "App Screenshots"
            name: "appScreenshots"
            widget: "list"
            label_singular: "Screenshot"
            fields:
              - { label: "Screenshot", name: "image", widget: "image" }
              - { label: "Caption", name: "caption", widget: "string" }
          - label: "Trainers"
            name: "trainers"
            widget: "list"
            label_singular: "Trainer"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role Badge", name: "role", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Personal Quote", name: "quote", widget: "text", required: false }
              - { label: "Portrait Photo", name: "image", widget: "image" }
          - label: "1:1 Pricing Tiers"
            name: "pricingTiers"
            widget: "list"
            label_singular: "Tier"
            fields:
              - { label: "ID (lowercase, no spaces)", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price (USD)", name: "price", widget: "number", value_type: "int" }
              - { label: "Duration", name: "duration", widget: "string", default: "1 hour" }
              - { label: "Badge (optional)", name: "badge", widget: "string", required: false }
              - { label: "Highlight This Tier", name: "featured", widget: "boolean", default: false }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Features"
                name: "features"
                widget: "list"
                field: { label: "Feature", name: "feature", widget: "string" }
          - label: "Google Reviews"
            name: "reviews"
            widget: "list"
            label_singular: "Review"
            fields:
              - { label: "Reviewer Name", name: "name", widget: "string" }
              - { label: "Initials", name: "initials", widget: "string" }
              - { label: "Rating (1–5)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
              - { label: "Review Text", name: "text", widget: "text" }
          - label: "FAQs"
            name: "faqs"
            widget: "list"
            label_singular: "FAQ"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }
          - label: "Studio Policies"
            name: "policies"
            widget: "object"
            fields:
              - { label: "First-Timers", name: "firstTimers", widget: "text" }
              - { label: "What to Wear / Bring", name: "attire", widget: "text" }
              - { label: "Cancellation & Rescheduling", name: "cancellation", widget: "text" }
              - { label: "Late Arrivals", name: "late", widget: "text" }
              - { label: "Training Philosophy", name: "philosophy", widget: "text" }
  - name: "articles"
    label: "Articles"
    icon: "article"
    files:
      - name: "articles"
        label: "Articles"
        file: "src/data/articles.json"
        description: "Full articles shown on the Articles page and each article page."
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            label_singular: "Article"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL Slug", name: "slug", widget: "string", hint: "lowercase-with-dashes — becomes /post/slug" }
              - { label: "Author", name: "author", widget: "string", default: "Izzy Jacobus" }
              - { label: "Date", name: "date", widget: "string" }
              - { label: "Read Time", name: "readTime", widget: "string" }
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Excerpt", name: "excerpt", widget: "text" }
              - { label: "Body (Markdown)", name: "content", widget: "markdown" }
