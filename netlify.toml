[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"

[[headers]]
  for = "/studio-version.json"
  [headers.values]
    Cache-Control = "no-store"

# netlify.toml redirects are processed before public/_redirects, so the legacy
# admin URL keeps its permanent redirect ahead of the SPA fallback below.
[[redirects]]
  from = "/admin/index.html"
  to = "/admin"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
